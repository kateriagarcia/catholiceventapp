services:
  - type: web
    name: parish-event-finder-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    # Free-tier services have no persistent disk, so the SQLite file is
    # rebuilt from scratch on every cold start. migrate is idempotent
    # (CREATE TABLE IF NOT EXISTS) and seed skips itself if data exists,
    # so this is safe to run on every startup.
    startCommand: npm run migrate && npm run seed && npm start
    envVars:
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: CLIENT_SUCCESS_URL
        sync: false
      - key: CLIENT_CANCEL_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STANDARD
        sync: false
      - key: STRIPE_PRICE_FEATURED
        sync: false

  - type: web
    runtime: static
    name: parish-event-finder-client
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
